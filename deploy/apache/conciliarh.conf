# ConciliaRH — VirtualHost de PRODUCCIÓN (docs/DEPLOYMENT.md §8). Apache 2.4 + PHP-FPM (proxy_fcgi).
# No asume un proveedor de hosting. Ajuste ServerName, certificados y el socket de PHP-FPM.
# Módulos: ssl, headers, rewrite, proxy, proxy_fcgi, setenvif, remoteip (sólo si hay balanceador), reqtimeout.
#
# Global, recomendado. En Debian/Ubuntu en /etc/apache2/conf-available/zz-conciliarh.conf (a2enconf zz-conciliarh): el
# nombre «zz-» hace que se cargue DESPUÉS de security.conf, que de lo contrario restablece ServerTokens OS.
#   ServerTokens Prod
#   ServerSignature Off
#   TraceEnable Off
#   FileETag None

<VirtualHost *:80>
    ServerName conciliarh.municipio.example
    # Todo HTTP pasa a HTTPS; nada de la aplicación se sirve en claro
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName conciliarh.municipio.example

    SSLEngine on
    SSLCertificateFile      /etc/ssl/certs/conciliarh.crt
    SSLCertificateKeyFile   /etc/ssl/private/conciliarh.key
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # El ÚNICO directorio servido es public/. Código, configuración, storage y .env quedan fuera.
    DocumentRoot /opt/conciliarh/current/public
    <Directory />
        Require all denied
        AllowOverride None
        Options None
    </Directory>
    # /opt/conciliarh/current es un ENLACE a la versión instalada (docs/DEPLOYMENT.md §12): se permite seguirlo sólo si
    # enlace y destino son del mismo dueño (root). Nada de /opt/conciliarh se sirve salvo public/ (abajo).
    <Directory /opt/conciliarh>
        Options SymLinksIfOwnerMatch
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /opt/conciliarh/current/public>
        Require all granted
        AllowOverride None
        Options -Indexes -MultiViews +SymLinksIfOwnerMatch
        # Front controller (equivale a public/.htaccess; con AllowOverride None se declara aquí)
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
    # Ningún otro PHP de public/ se ejecuta: sólo el front controller
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
        SetHandler "proxy:unix:/run/php/conciliarh-fpm.sock|fcgi://localhost"
    </Files>
    # Archivos ocultos (.env, .git, .htaccess) nunca
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Límites: LimitRequestBody > post_max_size > upload_max_filesize > MAX_UPLOAD_SIZE (25 MiB)
    LimitRequestBody 33554432
    LimitRequestFields 60
    LimitRequestFieldSize 8190
    # Clientes lentos (mod_reqtimeout)
    RequestReadTimeout header=20-40,MinRate=500 body=60,MinRate=500
    Timeout 300

    # Cabeceras: la aplicación ya envía CSP estricta, X-Frame-Options, nosniff, Referrer-Policy, Permissions-Policy, COOP/CORP
    # y HSTS. Apache sólo garantiza HSTS también en respuestas que no pasan por PHP (estáticos, errores) sin duplicarla.
    Header always setifempty Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always unset X-Powered-By
    # Estáticos versionados en caché; las páginas de la aplicación llevan no-store (la envía PHP)
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>
    # Métodos: la aplicación sólo usa GET, HEAD y POST
    <Location />
        <LimitExcept GET HEAD POST>
            Require all denied
        </LimitExcept>
    </Location>

    # --- Detrás de un balanceador o proxy inverso (docs/DEPLOYMENT.md §8.3) ----------------------------------
    # La aplicación confía SÓLO en REMOTE_ADDR. mod_remoteip lo reemplaza por la IP real ÚNICAMENTE cuando la petición
    # llega desde un proxy listado aquí; nunca se confía en X-Forwarded-For de cualquier origen.
    # RemoteIPHeader X-Forwarded-For
    # RemoteIPInternalProxy 192.0.2.10
    # Si el proxy termina TLS, marque HTTPS sólo para peticiones que vienen de ese proxy:
    # SetEnvIfExpr "-R '192.0.2.10' && req('X-Forwarded-Proto') == 'https'" HTTPS=on

    ErrorLog  ${APACHE_LOG_DIR}/conciliarh-error.log
    # Sin cadena de consulta en el log de acceso (los filtros pueden llevar nombres buscados)
    LogFormat "%a %l %u %t \"%m %U %H\" %>s %b %D \"%{User-Agent}i\" %{X-Request-Id}o" conciliarh
    CustomLog ${APACHE_LOG_DIR}/conciliarh-access.log conciliarh
</VirtualHost>
