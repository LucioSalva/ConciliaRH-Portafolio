# ConciliaRH — complemento para la unidad de PHP-FPM de la distribución (docs/DEPLOYMENT.md §7):
#   /etc/systemd/system/php8.4-fpm.service.d/conciliarh.conf   (ajuste 8.4 a la versión instalada)
[Service]
# Archivos nuevos sin permisos para «otros» (exportaciones temporales, logs)
UMask=0027
# Los procesos de PHP no ven a los de otros usuarios (entorno de comandos de administración, del worker o del scheduler)
ProtectProc=invisible
ProcSubset=pid
NoNewPrivileges=true
