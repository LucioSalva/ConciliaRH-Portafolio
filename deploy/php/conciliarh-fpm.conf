; ConciliaRH — pool de PHP-FPM (docs/DEPLOYMENT.md §7). /etc/php/8.x/fpm/pool.d/conciliarh.conf
[conciliarh]
user = conciliarh-web
group = conciliarh-web
listen = /run/php/conciliarh-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 30
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 300
; La configuración llega por <instalación>/.env (enlace a /etc/conciliarh/web.env, 0640 root:conciliarh-web).
clear_env = yes
security.limit_extensions = .php
php_admin_value[open_basedir] = /opt/conciliarh/:/var/lib/conciliarh/:/etc/conciliarh/web.env:/tmp/
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,mail,mb_send_mail,putenv
php_admin_value[error_log] = /var/lib/conciliarh/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[upload_tmp_dir] = /var/lib/conciliarh/trabajo
php_admin_value[sys_temp_dir] = /var/lib/conciliarh/trabajo
