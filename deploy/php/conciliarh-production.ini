; ConciliaRH — php.ini de PRODUCCIÓN (docs/DEPLOYMENT.md §7). /etc/php/8.x/{fpm,cli}/conf.d/90-conciliarh.ini
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
date.timezone = America/Mexico_City
memory_limit = 512M
max_execution_time = 300
; Coherente con MAX_UPLOAD_SIZE = 25 MiB y LimitRequestBody = 32 MiB
upload_max_filesize = 26M
post_max_size = 30M
max_file_uploads = 20
file_uploads = On
allow_url_fopen = Off
allow_url_include = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
; Con validate_timestamps = 0: recargar PHP-FPM en cada despliegue (docs/DEPLOYMENT.md §12)
