# ConciliaRH — vhost de DESARROLLO.
# El único directorio expuesto es public/. storage/, app/, config/ y .env quedan fuera.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html>
        Require all denied
        AllowOverride None
    </Directory>

    <Directory /var/www/html/public>
        Require all granted
        Options -Indexes -MultiViews +FollowSymLinks
        # Se permite .htaccess para validar el mismo archivo que se usará en hosting de producción
        AllowOverride All
    </Directory>

    LimitRequestBody 33554432
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
