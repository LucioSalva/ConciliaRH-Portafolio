; ConciliaRH — php.ini de desarrollo (Docker)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
date.timezone = America/Mexico_City
memory_limit = 256M
; Coherente con MAX_UPLOAD_SIZE (25 MB por omisión): PHP ligeramente por encima para que la
; aplicación emita el error controlado UPLOAD_DEMASIADO_GRANDE; Apache LimitRequestBody = 32 MB.
upload_max_filesize = 26M
post_max_size = 30M
max_file_uploads = 20
file_uploads = On
allow_url_fopen = Off
allow_url_include = Off
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
